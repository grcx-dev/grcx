[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grcx"
version = "0.1.0"
description = "GRCX — the regulatory compliance monitoring agent that never sleeps"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Neil Lowden", email = "neil@grcx.dev"}]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "watchdog>=4.0.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0",
    "flask>=3.0.0",
    "google-genai>=1.0.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "flask-limiter>=4.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "freezegun>=1.4.0",
    "hypothesis>=6.0.0",
]

[project.scripts]
grcx = "grcx.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["grcx*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "live: tests that hit real external networks (RSS feeds, IMAP, LLM APIs); skipped by default",
]

[tool.mutmut]
paths_to_mutate = ["grcx/audit/log.py"]
# Mutmut runs from inside its mutants/ subdir, so we override pytest's testpaths
# (which would otherwise auto-discover the whole tests/ directory) and pass an
# absolute --rootdir so the listed test files resolve correctly.
runner = ".venv/bin/python -m pytest -x -q --override-ini='testpaths=' tests/test_audit_log.py tests/test_audit_log_corruption.py tests/test_audit_chain_stress.py tests/test_fingerprint.py"
do_not_mutate = ["__init__.py"]

[dependency-groups]
dev = []
