<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRCX — Sign In</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F1A2E;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .auth-card {
      background: #1C2D45;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .auth-logo-text { font-size: 20px; font-weight: 700; }
    .auth-logo-sub { font-size: 11px; color: #94A3B8; margin-top: -2px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .auth-subtitle { font-size: 14px; color: #94A3B8; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #CBD5E1; margin-bottom: 6px; }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: #162236;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      color: #F1F5F9;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #0D9488; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #0D9488;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover { background: #14B8A8; }
    .error {
      background: rgba(239,68,68,0.12);
      color: #EF4444;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #94A3B8;
    }
    .switch a { color: #0D9488; text-decoration: none; }
    .switch a:hover { color: #14B8A8; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36">
        <title>GRCX radar mark</title>
        <line x1="55.3" y1="256.0" x2="456.7" y2="256.0" stroke="#E8F6F0" stroke-width="6.1" opacity="0.35"/>
        <line x1="256.0" y1="55.3" x2="256.0" y2="456.7" stroke="#E8F6F0" stroke-width="6.1" opacity="0.35"/>
        <circle cx="256.0" cy="256.0" r="181.8" fill="none" stroke="#E8F6F0" stroke-width="11.8"/>
        <circle cx="256.0" cy="256.0" r="119.1" fill="none" stroke="#E8F6F0" stroke-width="11.8"/>
        <circle cx="256.0" cy="256.0" r="56.3" fill="none" stroke="#E8F6F0" stroke-width="11.8"/>
        <line x1="256.0" y1="256.0" x2="384.5" y2="127.5" stroke="#FFFFFF" stroke-width="13.3" stroke-linecap="round"/>
        <circle cx="384.5" cy="127.5" r="25.6" fill="#F0A02A"/>
        <circle cx="256.0" cy="256.0" r="16.9" fill="#E8F6F0"/>
      </svg>
      <div>
        <div class="auth-logo-text">GRCX</div>
        <div class="auth-logo-sub">Regulatory Intelligence</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="auth-subtitle">Enter your credentials to access the dashboard.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" required placeholder="you@company.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
    <div class="switch">Don't have an account? <a href="/sign-up">Sign up</a></div>
  </div>
</body>
</html>
